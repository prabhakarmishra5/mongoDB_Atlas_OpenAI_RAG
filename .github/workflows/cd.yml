name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifact to workflow run
        run: |
          mkdir -p artifacts
          cp -r dist artifacts/dist
          tar -czf artifacts/mongodb-rag-dist.tgz -C artifacts dist

      - name: Publish GitHub release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="release-$SHORT_SHA"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Release $SHORT_SHA" --generate-notes
          gh release upload "$TAG" artifacts/mongodb-rag-dist.tgz --clobber
