[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-rag-v1"
version = "0.1.0"
description = "MongoDB Atlas Vector Search RAG demo"
requires-python = ">=3.9"
dependencies = [
  "pymongo>=4.9,<5",
  "openai>=1.55,<2",
  "langchain-text-splitters>=0.3,<0.4",
  "python-dotenv>=1.0,<2",
  "pypdf>=5.1,<6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
