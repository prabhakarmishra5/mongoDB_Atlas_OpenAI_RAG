[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-rag-v1"
version = "0.1.0"
description = "MongoDB Atlas Vector Search RAG demo"
requires-python = ">=3.9"
dependencies = [
  "pymongo",
  "openai",
  "langchain-text-splitters",
  "dotenv",
  "pypdf"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
